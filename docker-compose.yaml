version: '3.8'

services:
  app:
    image: ghcr.io/pevecyan/home-cast:1.5.0
    container_name: home-cast
    network_mode: "host"
    environment:
      # Set to your server's LAN IP so speakers can reach it
      - APP_HOSTNAME=http://192.168.1.100:5050
    volumes:
      - /data/home-cast/cache:/data/home-cast/cache
      - /data/home-cast/data:/app/data
    restart: unless-stopped
    # Cap memory so an audio-transcode spike (yt-dlp/ffmpeg) gets killed inside
    # the container instead of taking down the Docker daemon / other containers
    # on the host. Raise if playback of large playlists gets killed.
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
